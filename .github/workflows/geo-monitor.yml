name: GEO monitor (mensual)
on:
  schedule:
    - cron: "17 12 1 * *"   # día 1 de cada mes, 09:17 Montevideo
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r geo-monitor/requirements.txt
      - run: python3 geo-monitor/monitor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit resultados
        run: |
          git config user.name "geo-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add geo-monitor/results
          git diff --cached --quiet || git commit -m "GEO monitor: $(date +%Y-%m)"
          git push
